[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "bruz-ocr"
version = "0.1.0"
description = "Local document OCR and intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "Pillow>=10.4,<13",
  "pydantic-settings>=2.5,<3",
  "pypdfium2>=5.13,<6",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.11,<2", "pytest>=8,<9", "ruff>=0.6,<1", "types-Pillow>=10.2"]

[project.scripts]
bruz-ocr = "bruz_ocr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["bruz_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires locally installed OCR models"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["bruz_ocr"]
strict = true
